<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Assignment Cover</title>
    <style>
        @font-face {
            font-family: 'Poppins';
            src: url('fonts/Poppins-Regular.ttf') format('truetype');
        }
        @page { size: A4; margin: 0; }
        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }
        .page-container {
            width: 100%;
            height: 100%;
            padding: 15mm;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.1;
            width: 60%;
        }

        .header {
            text-align: center;
            width: 100%;
        }
        .logo { max-width: 250px; }
        .university-name { font-size: 28px; font-weight: bold; margin-top: 10px; }
        
        .assignment-section {
            margin: 40px 0;
            text-align: center;
            line-height: 2;
            font-size: 18px;
        }
        .assignment-section .label { font-weight: bold; }
        .assignment-title { font-size: 18px; font-weight: bold; }

        .submission-section {
            width: 80%;
            margin-top: 20px;
            line-height: 2.2;
            font-size: 16px;
        }
        .submission-section h3 {
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 5px;
            border-bottom: 2px solid #ccc;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: auto;
            font-size: 16px;
            font-weight: bold;
        }

    </style>
</head>
<body>
<div class="page-container">
    <img src="watermark.jpg" class="watermark" />

    <div class="header">
        <img src="logo.png" class="logo" />
        <div class="university-name">State University of Bangladesh</div>
    </div>

    <div class="assignment-section">
        <span class="label">Assignment on:</span> <br> <span class="assignment-title">{{assignment_topic}}</span><br>
        <span class="label">Course Code:</span> {{course_code}}<br>
        <span class="label">Course Title:</span> {{course_title}}
    </div>

    <div class="submission-section">
        {{SUBMITTED_TO_SECTION}}
    </div>

    <div class="submission-section">
        <h3>Submitted By:</h3>
        <strong>Name:</strong> {{by_name}}<br>
        <strong>ID:</strong> {{by_id}}<br>
        <strong>Department:</strong> {{by_department}}
    </div>

    <div class="footer">
        Date of Submission: {{submission_date}}
    </div>
</div>
</body>
</html>
