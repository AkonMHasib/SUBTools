<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Assignment Cover</title>
    <style>
        @font-face {
            font-family: 'Poppins';
            src: url('fonts/Poppins-Regular.ttf') format('truetype');
        }
        @page { size: A4; margin: 0; }
        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background-color: #ffffff;

        .page-container {

            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center; /* Vertically center the content */
        }

        .logo { max-width: 250px;         align-self: center; }

        .assignment-topic-box {
            background-color: #C8E6C9; /* Even lighter green */
            color: #1B5E20;
            padding: 15px;
            text-align: center;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;

        }
        .content-area {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content:center;
            margin: 10mm;
        }
        .submission-box {
            border: 1px solid #C8E6C9;
            border-radius: 8px;
            padding: 20px;
            background-color: white;
            line-height: 1.8;
        }
        .submission-box h3 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            color: #388E3C;
        }
        .footer {
            background-color: #A5D6A7; /* Light green footer */
            color: #1B5E20;
            padding: 15px;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="page-container">

    <div class="content-area">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="assignment-topic-box">{{assignment_topic}}</div>
        {{SUBMITTED_TO_SECTION}}
        <div class="submission-box">
            <h3>Submitted By</h3>
            <strong>Name:</strong> {{by_name}}<br>
            <strong>ID:</strong> {{by_id}}<br>
            <strong>Department:</strong> {{by_department}}
        </div>
    </div>
    <div class="footer">
        Submitted on {{submission_date}}
    </div>
</div>
</body>
</html>
